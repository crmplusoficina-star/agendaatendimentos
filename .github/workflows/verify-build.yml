name: Verify build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/patch-v4.mjs && node scripts/fix-v4.mjs
      - run: sed -n '496,500p' src/AppNoAuthV3.tsx
      - run: npx tsc -b --pretty false
      - run: npx vite build
